<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دخول الإدارة</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap');
    
    body { 
        margin: 0;
        background: radial-gradient(circle at center, #1a1a1a 0%, #0b0b0b 100%); 
        color: #fff; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        font-family: 'Tajawal', sans-serif; 
    }
    .login-box { 
        background: #121212; 
        padding: 40px; 
        border-radius: 20px; 
        width: 320px; 
        border: 1px solid #222; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        text-align: center;
    }
    h2 { margin-bottom: 25px; font-weight: 700; color: #55c5d1; letter-spacing: 1px; }
    
    input { 
        width: 100%; 
        padding: 14px; 
        margin: 10px 0; 
        background: #1a1a1a; 
        border: 1px solid #333; 
        color: #fff; 
        border-radius: 10px; 
        box-sizing: border-box;
        transition: 0.3s;
    }
    input:focus { border-color: #55c5d1; outline: none; box-shadow: 0 0 8px rgba(85,197,209,0.3); }
    
    button { 
        width: 100%; 
        padding: 14px; 
        margin-top: 15px;
        background: linear-gradient(90deg, #55c5d1, #48a8b3); 
        border: none; 
        border-radius: 10px; 
        cursor: pointer; 
        color: #000; 
        font-weight: bold; 
        font-size: 16px;
        transition: 0.3s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(85,197,209,0.4); }
</style>
</head>
<body>
    <div class="login-box">
        <h2>دخول الإدارة</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="login()">دخول</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        // !!! ضع هنا بياناتك (من Project Settings في Firebase) !!!
const firebaseConfig = {
    apiKey: "AIzaSyCKqZSI29w9Cxb10-WmSII62pbtS3ZQGuc",
    authDomain: "man-zone-iq.firebaseapp.com",
    projectId: "man-zone-iq",
    storageBucket: "man-zone-iq.appspot.com",
    messagingSenderId: "192366160615",
    appId: "1:192366160615:web:5d92d2ff0c7ed68d641042"
};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.login = () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, password)
                .then(() => { window.location.href = "admin.html"; })
                .catch((err) => { alert("خطأ: " + err.message); });
        };
    </script>
</body>
</html>
